<div class="o-analytics_years--year">
    <h2>{{year.title}}</h2>
    <p>{{year.articles}} articles, {{year.authors}} authors, {{year.new_contributors}} new authors</p>
    <p>{{year.top}}% of authors authored ~50% of articles</p>

    <ul>
    {% for section in year.sections %}
        <li>{{section.title}} ({{section.articles}})</li>
    {% endfor %}
    </ul>
</div>
