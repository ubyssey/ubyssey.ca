{% load wagtailimages_tags %}
<figure class="au-gallery__item">
  <a href="{{ image.file.url }}" aria-label="View {{ image.title|default:'photo' }}">{% image image fill-800x650-c100 format-webp loading='lazy' %}</a>
  {% if image.title or image.description %}<figcaption>{% if image.title %}<strong>{{ image.title }}</strong>{% endif %}{% if image.description %}<span>{{ image.description|striptags }}</span>{% endif %}</figcaption>{% endif %}
</figure>
