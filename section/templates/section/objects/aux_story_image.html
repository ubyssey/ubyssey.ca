{% load wagtailimages_tags %}
{% if article.preview_image %}<img src="{{ article.preview_image }}" alt="{{ article.preview_alt|default:article.title }}" loading="lazy">
{% elif article.featured_media.first.image %}{% image article.featured_media.first.image fill-1000x760-c100 format-webp loading='lazy' alt=article.featured_media.first.alt_text %}
{% endif %}
