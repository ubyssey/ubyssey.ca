version: "3.7"
services:

  mysql:
    platform: linux/x86_64
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ubyssey
      MYSQL_USER: ubyssey
      MYSQL_PASSWORD: ${SQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SQL_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: "/usr/bin/mysql --user=ubyssey --password=${SQL_PASSWORD} --execute \"SHOW DATABASES;\""
      interval: 2s
      timeout: 20s
      retries: 20

  django:
    image: ghcr.io/ubyssey/ubyssey.ca:${TAG}
    command: >
      bash -c "python manage.py migrate
      && gunicorn ubyssey.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SQL_HOST: mysql
      SQL_USER: root
      SQL_PASSWORD: ${SQL_PASSWORD}
      SQL_DATABASE: ubyssey
      GS_ACCESS_KEY_ID: ${GS_ACCESS_KEY_ID}
      GS_SECRET_ACCESS_KEY: ${GS_SECRET_ACCESS_KEY}
      STATIC_URL: https://storage.googleapis.com/ubyssey-staging/static/
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/GOOGLE_APPLICATION_CREDENTIALS
    secrets:
      - GOOGLE_APPLICATION_CREDENTIALS
    expose:
      - 8000
    depends_on:
      mysql:
        condition: service_healthy
        restart: true

  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    restart: always
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./certbot/www/:/var/www/certbot/:ro
    depends_on:
      - django

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:r

secrets:
  GOOGLE_APPLICATION_CREDENTIALS:
    file: ./service-account.json
