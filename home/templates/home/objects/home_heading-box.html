<div {%if id %} id="{{id}}" {% endif %} class="o-boxLabel {{styling}}">
    <div class="o-boxLabel-left">
        <h2 class="boxText boxText-left">{{title|safe}}</h2>
    </div>
    <div class="o-boxLabel-right">
        <p class="boxText boxText-right" {%if textId %}id="{{textId}}"{% endif %}>{% if text %} {{text|safe}}{% endif %}{% if textBold %}&nbsp; <strong>{{textBold|safe}}</strong>{% endif %}</p>
    </div>
</div>
