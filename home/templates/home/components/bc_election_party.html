{% load wagtailimages_tags articletags %}
<article class="bc-party">
  <a class="bc-party__link" href="{{ item.article.url }}">
    {% if item.logo %}<span class="bc-party__logo">{% image item.logo width-120 loading="lazy" alt="" %}</span>{% endif %}
    <span class="bc-party__copy">
      <span class="bc-party__name"><span>{{ item.label|default:item.article.title }}</span></span>
    </span>
    <span class="bc-party__arrow" aria-hidden="true">↗</span>
  </a>
  <div class="bc-election-byline"><span class="bc-election-byline__prefix">By</span> {{ item.article|redesign_card_byline|normalize_redesign_byline|safe }}</div>
</article>
