name: Deploy to production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:

    needs: build

    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - run: |
          npm install
          npm install -g gulp
          npm rebuild node-sass
          gulp build
        working-directory: ubyssey/static_src
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect Django static files
        run: DJANGO_SETTINGS_MODULE=config.settings.base python manage.py collectstatic --noinput

      - name: Authenticate with Google Cloud Platform
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/863738545301/locations/global/workloadIdentityPools/ubyssey-wif-pool-prd/providers/ubyssey-oidc-github-prd'
          service_account: 'deployment@ubyssey-prd.iam.gserviceaccount.com'

      - name: Upload static files to Google Cloud Storage
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'static'
          destination: 'ubyssey'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: deploy-production
          SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY_PRODUCTION }}
          SSH_HOST: ${{ secrets.GCP_SSH_HOST_PRODUCTION }}
      
      - name: Create ubyssey.ca directory
        run: ssh production "mkdir -p /opt/ubyssey.ca"

      - name: Set tag in docker-compose.production.yml
        run: sed -i "s/\${TAG}/${{ github.ref_name }}/g" deployment/compose/docker-compose.production.yml

      - name: Upload Docker Compose configuration
        run: scp deployment/compose/docker-compose.production.yml production:/opt/ubyssey.ca/docker-compose.yml

      - name: Upload nginx configuration
        run: scp deployment/nginx/nginx.production.conf production:/opt/ubyssey.ca/nginx/nginx.conf

      - name: Upload certbot and nginx reload scripts
        run: |
          ssh production "mkdir -p /opt/ubyssey.ca/scripts"
          scp deployment/scripts/certbot-renewal-with-nginx-reload.sh production:/opt/ubyssey.ca/scripts/certbot-renewal-with-nginx-reload.sh
          scp deployment/scripts/nginx-reload-watcher.sh production:/opt/ubyssey.ca/scripts/nginx-reload-watcher.sh

      - name: Verify Docker secrets exist
        run: |
          echo "Verifying each docker secret exists..."

          # Get all secret names
          SECRET_NAMES=$(ssh production "docker secret ls --format '{{.Name}}'")
          
          # Inspect each secret to verify it exists
          for secret in $SECRET_NAMES; do
            if ssh production "docker secret inspect $secret" >/dev/null 2>&1; then
              echo "✅ $secret"
            else
              echo "❌ $secret failed inspection"
              exit 1
            fi
          done
          
          echo "All secrets verified"

      - name: Sync secrets from Google Cloud Platform
        run: cat scripts/sync-secrets.sh | ssh production
      
      - name: Create shared network
        run: ssh production "docker network create --driver=overlay proxy-shared || true"

      - name: Deploy stack
        run: ssh production docker stack deploy --resolve-image always --compose-file /opt/ubyssey.ca/docker-compose.yml ubyssey

      - name: Force update all services
        run: |
          ssh production "for service in \$(docker stack services ubyssey --format '{{.Name}}'); do docker service update --force \$service; done"

      - name: Verify deployment succeeded
        run: |
          # Wait for update to complete
          sleep 30

          # Check if services are running the expected image
          EXPECTED_IMAGE="ghcr.io/ubyssey/ubyssey.ca:${{ github.ref_name }}"

          for service in ubyssey_django-wsgi ubyssey_django-asgi; do
            ACTUAL_IMAGE=$(ssh production "docker service inspect $service --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' | cut -d@ -f1")
            echo "Service $service is running: $ACTUAL_IMAGE"

            if [[ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]]; then
              echo "ERROR: Service $service is not running expected image!"
              echo "Expected: $EXPECTED_IMAGE"
              echo "Actual: $ACTUAL_IMAGE"
              echo "Deployment may have been rolled back!"
              exit 1
            fi
          done

          echo "All services verified to be running correct image"

      - name: Check health of the application
        run: |
          echo "Waiting for services to start..."
          MAX_ATTEMPTS=15
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Health check attempt $i/$MAX_ATTEMPTS..."
            if ssh production "curl -f https://ubyssey.ca/health/" >/dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            else
              echo "Attempt $i failed - showing error details:"
              ssh production "curl -f https://ubyssey.ca/health/"
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1