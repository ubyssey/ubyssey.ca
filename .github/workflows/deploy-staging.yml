name: Deploy to staging

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=raw,value=staging-{{sha}}
            type=ref,event=branch,suffix=-staging
            type=sha,prefix=staging-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-buildcache,mode=max

  deploy:
    needs: build

    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - run: |
          npm install
          npm install -g gulp
          npm rebuild node-sass
          gulp build
        working-directory: ubyssey/static_src
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect Django static files
        run: DJANGO_SETTINGS_MODULE=config.settings.base python manage.py collectstatic --noinput

      - name: Authenticate with Google Cloud Platform
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/1012602718138/locations/global/workloadIdentityPools/ubyssey-wif-pool-staging/providers/ubyssey-oidc-github-staging'
          service_account: 'deployment@ubyssey-staging.iam.gserviceaccount.com'

      - name: Upload static files to Google Cloud Storage
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'static'
          destination: 'ubyssey-staging'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: deploy
          SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY_STAGING }}
          SSH_HOST: ${{ secrets.GCP_SSH_HOST_STAGING }}
          
      - name: Set staging tag
        run: |
          echo "STAGING_TAG=staging" >> $GITHUB_ENV
          echo "Using staging tag: staging"

      - name: Set tag in docker-compose.yml
        run: sed -i "s/\${TAG}/${{ env.STAGING_TAG }}/g" docker-compose.yml

      - name: Upload Docker Compose configuration
        run: scp docker-compose.yml staging:/opt/ubyssey.ca/docker-compose.yml

      - name: Upload nginx configuration
        run: scp nginx-staging.conf staging:/opt/ubyssey.ca/nginx/nginx.conf

      - name: Upload certbot and nginx reload scripts
        run: |
          ssh staging "mkdir -p /opt/ubyssey.ca/scripts"
          scp scripts/certbot-renewal-with-nginx-reload.sh staging:/opt/ubyssey.ca/scripts/certbot-renewal-with-nginx-reload.sh
          scp scripts/nginx-reload-watcher.sh staging:/opt/ubyssey.ca/scripts/nginx-reload-watcher.sh

      - name: Sync secrets from Google Cloud Platform
        run: cat scripts/sync-secrets.sh | ssh staging

      - name: Restart services
        run: ssh staging docker stack deploy --compose-file /opt/ubyssey.ca/docker-compose.yml ubyssey
