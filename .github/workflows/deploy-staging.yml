name: Deploy to staging

on:
  push:
    branches:
      - new-deployment-strategy
  workflow_run:
    workflows: ["Deploy to production"]
    types:
      - completed

jobs:
  deploy:
    # Run on push to new-deployment-strategy branch OR if production build was successful
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - run: |
          npm install
          npm install -g gulp
          npm rebuild node-sass
          gulp build
        working-directory: ubyssey/static_src
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect Django static files
        run: DJANGO_SETTINGS_MODULE=config.settings.base python manage.py collectstatic --noinput

      - name: Authenticate with Google Cloud Platform
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/1012602718138/locations/global/workloadIdentityPools/ubyssey-wif-pool-staging/providers/ubyssey-oidc-github-staging'
          service_account: 'deployment@ubyssey-staging.iam.gserviceaccount.com'

      - name: Upload static files to Google Cloud Storage
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'static'
          destination: 'ubyssey-staging'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: deploy
          SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY_STAGING }}
          SSH_HOST: ${{ secrets.GCP_SSH_HOST_STAGING }}
          
      - name: Get latest release tag
        id: get_latest_release
        run: |
          echo "RELEASE_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
          echo "Using latest release tag: $RELEASE_TAG"

      - name: Set tag in docker-compose.yml
        run: sed -i "s/\${TAG}/${{ env.RELEASE_TAG }}/g" docker-compose.yml

      - name: Upload Docker Compose configuration
        run: scp docker-compose.yml staging:/opt/ubyssey.ca/docker-compose.yml

      - name: Upload nginx configuration
        run: scp nginx-staging.conf staging:/opt/ubyssey.ca/nginx/nginx.conf

      - name: Upload certbot renewal script
        run: |
          ssh staging "mkdir -p /opt/ubyssey.ca/scripts"
          scp scripts/certbot-renewal-with-nginx-reload.sh staging:/opt/ubyssey.ca/scripts/certbot-renewal-with-nginx-reload.sh

      - name: Sync secrets from Google Cloud Platform
        run: cat scripts/sync-secrets.sh | ssh staging

      - name: Restart services
        run: ssh staging docker stack deploy --compose-file /opt/ubyssey.ca/docker-compose.yml ubyssey
