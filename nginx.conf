worker_processes 1;

events {
  worker_connections 1024;
  accept_mutex off;
}

http {
  # Geo mapping for search engine bot whitelisting
  # This creates a variable $is_bot that is 1 for whitelisted IPs, 0 otherwise
  geo $is_bot {
    default 0;
    include /etc/nginx/bot-whitelist/googlebot.conf;
    include /etc/nginx/bot-whitelist/bingbot.conf;
    include /etc/nginx/bot-whitelist/other-bots.conf;
  }

  # Map the bot status to rate limit key
  # If it's a bot ($is_bot = 1), the key is empty, which disables rate limiting
  # Otherwise, use the client's IP address for rate limiting
  map $is_bot $limit_key {
    0 $binary_remote_addr;
    1 "";
  }

  # Create a rate limit zone based on the limit_key
  limit_req_zone $limit_key zone=bot_aware_limit:10m rate=10r/s;

  upstream app_server {
    server django:8000 fail_timeout=0;
  }

  #upstream thothbackend {
  #  server thothbackend:8000 fail_timeout=0;
  #}

  #upstream thothfrontend {
  #  server thothfrontend:3000 fail_timeout=0;
  #}

  server {
    # If no Hhst match, close the connection to prevent host spoofing
    listen 80 default_server;
    return 444;
  }

