{% load wagtailcore_tags %} 
<div class="c-liveblog">
    <div id="liveblog">
        {% for update in updates %}
            {% include "liveblog/objects/liveblog-update.html" %}
        {% endfor %}
    </div>

    {{ self.id|json_script:"room-name" }}
    {{ update_order|json_script:"update-order" }}


    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);

        function setUpdateOrder(){
            if (JSON.parse(document.getElementById('update-order').textContent) == "asc") {
                return "asc";
            }
            return "desc";
        }

        const updateOrder = setUpdateOrder();

        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/liveblog/'
            + roomName
            + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (updateOrder=="asc") {
                document.querySelector('#liveblog').innerHTML += (data.message + '\n');
            } else {
                document.querySelector('#liveblog').innerHTML = (data.message + '\n') + document.querySelector('#liveblog').innerHTML;
            }
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };
    </script>
</div>
