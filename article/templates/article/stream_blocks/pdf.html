<div class="attachment">
    <iframe class="pdf" src="{{self.pdf.url}}" title="{{ self.pdf.title|default:'Embedded PDF' }}" loading="lazy"></iframe>
    {% if self.caption or self.credit %}
    <div class="caption">
        <span data-article-editable-stream-field="content" data-article-editable-path="caption" data-article-editable-mode="richtext">{{ self.caption|safe }}</span> <span class="credit" data-article-editable-stream-field="content" data-article-editable-path="credit">{% if self.credit %}{{ self.credit }}{% endif %}</span>
    </div>
{% endif %}
</div>
