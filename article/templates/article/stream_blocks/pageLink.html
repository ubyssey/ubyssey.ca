{% load static %}
{% load wagtailcore_tags %}

<div class="header-menu">
     <ul>
          {% for item in self.list %}
               <li class="menu-title" style="--ar-menu-accent: #{{item.colour|default:'253273'}};">
                    <a href="#{{item.id|slugify}}"><span data-article-editable-stream-field="content" data-article-editable-path="list.{{ forloop.counter0 }}.title">{{item.title}}</span></a>
               </li>
          {% endfor %}
     </ul>
  </div>
  <button id="myBtn" title="Go to top">Back to top</button>

  <script src="{% static 'ubyssey/js/scrollTop.js' %}" type="text/javascript"></script>
