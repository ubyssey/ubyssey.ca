{% load wagtailcore_tags %}
{% load wagtailimages_tags %}

<div class="o-article-promo">
    <a href="{% pageurl self.article %}">
        {% image self.article.featured_media.first.image fill-340x238-c100 format-webp alt=self.article.featured_media.first.alt_text %}
    </a>
    <div class="o-article-promo--meta">
        <h3>
            <a href="{% pageurl self.article %}">{{self.article.title|safe}}</a>
        </h3>
        <div class="o-article-promo--meta--pubtime"><time datetime="{{self.article.published_at}}">{{self.article.published_at}}</time></div>
        <p class="o-article-promo--meta--lede">{{self.article.lede|safe}}</p>
    </div>
</div>
