{% load wagtailcore_tags %}
{% load wagtailimages_tags %}
{% load static %}

{% image self.images.0.image width-100 as first %}

  <div id="{{first.url|slugify}}" class="carousel slide {% if indicators != "false" %}indicators {% endif %}{% if nocaption %}no-caption {% endif %}{{self.images.0.style}} {{self.images.0.width}}"  style="--aspect-ratio: calc({{self.images.0.image.width}} / {{self.images.0.image.height}});">
    
    {% if indicators != "false" %}
      <div class="carousel-indicators">
        {% for image in self.images %}
          <button type="button" data-bs-target="#{{first.url|slugify}}" data-bs-slide-to="{{ forloop.counter0 }}" class="{% if forloop.first %}active{% endif %}" aria-current="true" aria-label="Slide {{ forloop.counter }}"></button>
        {% endfor %}
      </div>
    {% endif %}
    
    <div class="carousel-inner">
      {% for image_block in self.images %}
        <div class="carousel-item {% if forloop.first %}active{% endif %}">

          {% include_block image_block %}

        </div>
      {% endfor %}
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#{{first.url|slugify}}" data-bs-slide="prev" style="position: absolute;">
      <div class="carousel-control-container">
      <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon>
      <span class="visually-hidden">Previous</span>
      </div>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#{{first.url|slugify}}" data-bs-slide="next" style="position: absolute;">
      <div class="carousel-control-container">
      <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      <span class="visually-hidden">Next</span>
      </div>
    </button>
  </div>
