<div class="audio attachment">
    <audio controls>
        {% if self.audio %}
        <source src="{{self.audio.url}}" type="audio/{{self.format}}">
        {% endif %}
        Your browser does not support the audio element.
    </audio>
    {% include "article/stream_blocks/media-caption.html" with caption=self.caption caption_path="caption" %}
</div>
