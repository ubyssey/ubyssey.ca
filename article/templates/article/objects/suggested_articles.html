{% if suggested.redesign_rows %}
  <section class="c-suggested-bar ar-keep-reading" aria-label="More stories">
    {% for row in suggested.redesign_rows %}
      <div class="ar-keep-reading__row">
        <h2>More from <a href="{{ row.url }}">{{ row.title }}</a></h2>
        <div class="ar-keep-reading__grid">
          {% for article in row.articles %}{% include 'article/objects/suggested_article.html' with article=article %}{% endfor %}
        </div>
      </div>
    {% endfor %}
  </section>
{% endif %}
