{% load cache %}
{% load wagtailcore_tags %}
{% load video_filters %}
{% load articletags %}

{% if article.is_live %}
    <div class="o-article__published live">LIVE</div>
{% else %}
    <div class="o-article__published">{{ article.published_at|display_pubdate }}</div>
{% endif %}
<h3 class="o-article__headline">
    <a href="{% pageurl article %}">
        {{ article.title|safe }}
    </a>
</h3>
