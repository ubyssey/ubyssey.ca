{% load wagtailcore_tags %}

<section class="vogue-row" data-vogue-row>
  <div class="vogue-row__header" style="margin-bottom:1.25rem; display:block;">
    <div style="height:1px; background:#000;"></div>
    <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0.6rem 0;">
      <div></div>
      <h2 class="vogue-row__title" style="font-family:Arial,sans-serif; font-size:13px; font-weight:400; letter-spacing:0.25em; text-transform:uppercase; margin:0; color:#000; text-align:center;">{{ self.class_selector }}</h2>
      <div class="vogue-row__nav" style="display:flex; align-items:center; justify-content:flex-end; gap:0.25rem;">
        <button class="vogue-row__prev" aria-label="Previous" style="background:none; border:none; cursor:pointer; font-size:18px; line-height:1; padding:0 2px; color:#000;">&#8249;</button>
        <span class="vogue-row__counter" style="font-family:Arial,sans-serif; font-size:11px; min-width:2.5rem; text-align:center;"></span>
        <button class="vogue-row__next" aria-label="Next" style="background:none; border:none; cursor:pointer; font-size:18px; line-height:1; padding:0 2px; color:#000;">&#8250;</button>
      </div>
    </div>
    <div style="height:1px; background:#000;"></div>
  </div>
  <div class="vogue-row__track" style="display:grid; grid-template-columns:repeat(4,1fr); gap:1rem;">
    {% for card in self.stream %}
      {% include_block card %}
    {% endfor %}
  </div>
</section>
