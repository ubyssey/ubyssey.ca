{% load wagtailimages_tags %}
{% image card_image fill-400x300 as thumb %}

<div class="vogue-row-card">
  <a href="{{ self.card_page.url }}" class="vogue-row-card__img-link">
    <img src="{{ thumb.url }}" alt="{{ card_title }}" class="vogue-row-card__img">
  </a>
  <div class="vogue-row-card__body">
    {% if section_label %}
      <span class="vogue-row-card__label">{{ section_label }}</span>
    {% endif %}
    <a href="{{ self.card_page.url }}" class="vogue-row-card__link">
      <h3 class="vogue-row-card__title">{{ card_title }}</h3>
    </a>
    {% if card_author %}
      <div class="vogue-row-card__byline">{{ card_author }}</div>
    {% endif %}
  </div>
</div>
