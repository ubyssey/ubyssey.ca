{% load wagtailimages_tags %}
{% image self.card_image fill-400x300 as thumb %}

<div class="vogue-row-card">
  <a href="{{ self.card_page.url }}" class="vogue-row-card__img-link">
    <img src="{{ thumb.url }}" alt="{{ self.card_title }}" class="vogue-row-card__img">
  </a>
  <div class="vogue-row-card__body">
    {% if self.section_label %}
      <span class="vogue-row-card__label">{{ self.section_label }}</span>
    {% endif %}
    <a href="{{ self.card_page.url }}" class="vogue-row-card__link">
      <p class="vogue-row-card__title">{{ self.card_title }}</p>
    </a>
    {% if self.card_author %}
      <p class="vogue-row-card__byline">{{ self.card_author }}</p>
    {% endif %}
  </div>
</div>
