{% load wagtailimages_tags %}
{% image self.card_image fill-400x300 as thumb_img %}

<div class="{{ self.class_name }}">
  <div class="vogue-card__sidebar-content">
    {% if self.section_label %}
      <span class="vogue-card__label">{{ self.section_label }}</span>
    {% endif %}
    <a href="{{ self.card_page.url }}" class="vogue-card__title-link">
      <h3 class="vogue-card__title">{{ self.card_title }}</h3>
    </a>
    {% if self.card_author %}
      <p class="vogue-card__byline">{{ self.card_author }}</p>
    {% endif %}
  </div>
  <a href="{{ self.card_page.url }}" class="vogue-card__thumb-link">
    <img src="{{ thumb_img.url }}" alt="{{ self.card_title }}" class="vogue-card__thumbnail">
  </a>
</div>
