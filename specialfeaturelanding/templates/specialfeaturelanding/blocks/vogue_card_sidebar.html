{% load wagtailimages_tags %}

<div class="{{ self.class_name }}">
  <div class="vogue-card__sidebar-content">
    {% if section_label %}
      <span class="vogue-card__label">{{ section_label }}</span>
    {% endif %}
    <a href="{{ self.card_page.url }}" class="vogue-card__title-link">
      <h3 class="vogue-card__title">{{ card_title }}</h3>
    </a>
    {% if card_author %}
      <div class="vogue-card__byline">{{ card_author }}</div>
    {% endif %}
  </div>
  <a href="{{ self.card_page.url }}" class="vogue-card__thumb-link">
    {% image card_image fill-300x400 alt=card_title class="vogue-card__thumbnail" %}
  </a>
</div>
